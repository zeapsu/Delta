# Required before merge (branch protection on main): "Checks" and "E2E".
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # dependabot-update.yml dispatches CI after updating a branch, since its
  # GITHUB_TOKEN push doesn't trigger pull_request runs.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npx tsc --noEmit
      - name: Self-checks
        run: npm test
      # Dates follow the saved time zone. Between UTC+14 and UTC-11 the local
      # day differs from the UTC day at any hour, so UTC-only date math fails.
      - name: Self-checks in other time zones
        run: |
          TZ=Pacific/Kiritimati npm test
          TZ=Pacific/Pago_Pago npm test
      - name: DB smoke test
        run: npx tsx db/check.ts
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::db/schema.ts changed without a migration. Run npx drizzle-kit generate and commit drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: API, MCP and page tests (mock Plaid)
        run: npm run e2e
      - name: Upload report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e/.tmp/report
          retention-days: 14

  # The image as users get it: it must build, boot, migrate a fresh /data and
  # run the bundled CLI. Catches a file the Dockerfile forgot to copy or a
  # runtime dependency that only dev installs have. Not a required check.
  image:
    name: Image smoke test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t delta:ci --build-arg "DELTA_COMMIT=$GITHUB_SHA" .
      - name: Boot
        run: |
          docker run -d --name delta -p 127.0.0.1:3000:3000 -e DELTA_ALLOWED_NETWORKS=0.0.0.0/0 -e DELTA_UPDATE_CHECK=off delta:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then exit 0; fi
            sleep 2
          done
          echo "::error::The container did not answer on port 3000 within a minute."
          exit 1
      - name: Pages, API and CLI answer
        run: |
          set -euo pipefail
          curl -fsS -o home.html http://127.0.0.1:3000/
          grep -q "Delta" home.html
          # The agent API is up and wants a token.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v1/status)" = 401
          # The bundled CLI can mint one (tsx and the migrated DB are in the image), and it works.
          out=$(docker exec delta npm run --silent token -- create ci --scope read)
          [[ $out =~ dlt_[A-Za-z0-9_-]+ ]]
          curl -fsS -o status.json -H "Authorization: Bearer ${BASH_REMATCH[0]}" http://127.0.0.1:3000/api/v1/status
          grep -q '"connections"' status.json
          docker exec delta node scripts/backup-db.mjs
      - name: Logs
        if: ${{ !cancelled() }}
        run: docker logs delta

