# Known vulnerabilities in what ships (production dependencies, including the
# transitive ones Dependabot's weekly version bumps don't touch). Runs weekly
# and whenever the lockfile changes on main; a failure emails the repo owner.
# Not a required check: a new advisory shouldn't block unrelated PRs.
name: Audit

on:
  schedule:
    - cron: "41 6 * * 1"
  push:
    branches: [main]
    paths: [package-lock.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (production)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=moderate
