# Builds the self-hosted image for amd64 and arm64 and pushes it to GHCR
# (ghcr.io/<owner>/delta). Each platform builds natively on its own runner
# (ubuntu-24.04-arm for arm64), pushes by digest, and the merge job joins the
# digests into one multi-arch tag. GitHub's arm64 runners are free only on
# public repos, so a private repo falls back to QEMU on ubuntu-latest.
# Pull requests build amd64 only, without pushing.
# The merge job signs the multi-arch digest with cosign keyless (GitHub OIDC,
# no keys to keep), which covers every tag on it. The updater container checks
# that signature before it installs an image (scripts/updater-lib.mjs has the
# cosign image and the identity it accepts; docs/updating.md, "Signed images").
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: [Dockerfile, .dockerignore, package.json, package-lock.json, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/delta

jobs:
  image:
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ github.event_name == 'pull_request' && fromJSON('["linux/amd64"]') || fromJSON('["linux/amd64","linux/arm64"]') }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && (github.event.repository.private && 'ubuntu-latest' || 'ubuntu-24.04-arm') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Platform slug
        run: echo "SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: matrix.platform == 'linux/arm64' && github.event.repository.private
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-args: DELTA_COMMIT=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
          cache-from: type=gha,scope=${{ env.SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.SLUG }}
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ env.SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless: the OIDC token Sigstore issues the signing certificate for
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Create multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
      # Signs with the same pinned cosign image the updater verifies with. The
      # tags above are already live, so an update in the next minute or so is
      # refused for want of a signature; trying again later works.
      - name: Sign
        run: |
          COSIGN=$(node --input-type=module -e 'import { COSIGN_IMAGE } from "./scripts/updater-lib.mjs"; console.log(COSIGN_IMAGE)')
          DIGEST=$(docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")" --format '{{json .Manifest}}' | jq -r .digest)
          echo "REF=$IMAGE@$DIGEST" >> "$GITHUB_ENV"
          echo "COSIGN=$COSIGN" >> "$GITHUB_ENV"
          docker run --rm --user "$(id -u)" \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -e DOCKER_CONFIG=/docker -v "$HOME/.docker:/docker:ro" \
            -e HOME=/tmp \
            "$COSIGN" sign --yes "$IMAGE@$DIGEST"
          echo "Signed $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      # Exactly this workflow run's identity: proves the signature is there.
      - name: Verify (this run)
        run: |
          docker run --rm -e HOME=/tmp "$COSIGN" verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$WORKFLOW_REF" \
            "$REF" > /dev/null
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
      # The updater's own check, which accepts main and v* tags only.
      - name: Verify (as the updater does)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          mapfile -t ARGS < <(node --input-type=module -e 'import { verifyArgs } from "./scripts/updater-lib.mjs"; for (const a of verifyArgs(process.argv[1])) console.log(a)' "$REF")
          docker run --rm -e HOME=/tmp "$COSIGN" "${ARGS[@]}" > /dev/null
