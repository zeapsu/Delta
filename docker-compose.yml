# Self-hosted Delta. Setup: docs/self-hosting.md. In short:
#   cp .env.example .env   # add Plaid keys, set DELTA_BIND / DELTA_URL
#   docker compose up -d
# No .env is fine too: open Delta and paste the Plaid keys on /setup.
# For Portainer, CasaOS, Dockge and other app panels: home-server/compose.yaml.
services:
  delta:
    image: ghcr.io/zeapsu/delta:${DELTA_TAG:-latest}
    build:
      context: .
      # Lets the in-app update notice compare with the latest release (delta.sh sets it).
      args: { DELTA_COMMIT: "${DELTA_COMMIT:-}" }
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # Publish only on the private interface (your Tailscale IP). The default,
    # 127.0.0.1, is reachable from this machine only. Pages ask for no login
    # until you set a password (Settings → Password): anyone who can reach
    # this port sees your finances. On Linux with
    # Tailscale, use docker-compose.tailscale.yml (host networking) instead:
    # Docker's port publishing can hide the real tailnet client address.
    ports:
      - "${DELTA_BIND:-127.0.0.1}:${DELTA_PORT:-3000}:3000"
    volumes:
      - delta-data:/data

  # Plaid refresh + sync every 6h and a daily DB backup (the systemd timers'
  # job on bare metal). Shares delta's network namespace so its requests
  # arrive on loopback.
  jobs:
    image: ghcr.io/zeapsu/delta:${DELTA_TAG:-latest}
    build:
      context: .
      args: { DELTA_COMMIT: "${DELTA_COMMIT:-}" }
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    network_mode: "service:delta"
    depends_on: [delta]
    command: ["node", "scripts/jobs.mjs"]
    volumes:
      - delta-data:/data

  # Updates from the header's Update pill ("Update from the app",
  # docs/updating.md). Off unless the updater profile is on: ./delta.sh install
  # sets COMPOSE_PROFILES=updater in .env; ./delta.sh updater off turns it off.
  # It holds the Docker socket (root on the host), so it has no network and no
  # port, and the only thing it takes is a request file from the app. The web
  # app never gets the socket.
  updater:
    image: ghcr.io/zeapsu/delta:${DELTA_TAG:-latest}
    build:
      context: .
      args: { DELTA_COMMIT: "${DELTA_COMMIT:-}" }
    profiles: [updater]
    restart: unless-stopped
    user: "0:0" # the Docker socket is root's
    network_mode: none # the Docker daemon does the pulling; this needs no network
    command: ["node", "scripts/updater.mjs"]
    volumes:
      - delta-data:/data
      - ${DELTA_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock

volumes:
  delta-data:
