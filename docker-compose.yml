# Self-hosted Delta. Setup: docs/self-hosting.md. In short:
#   cp .env.example .env   # add Plaid keys, set DELTA_BIND / DELTA_URL
#   docker compose up -d
# No .env is fine too: open Delta and paste the Plaid keys on /setup.
# For Portainer, CasaOS, Dockge and other app panels: home-server/compose.yaml.
services:
  delta:
    image: ghcr.io/zeapsu/delta:${DELTA_TAG:-latest}
    build:
      context: .
      # Lets the in-app update notice compare against main (delta.sh sets it).
      args: { DELTA_COMMIT: "${DELTA_COMMIT:-}" }
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # Publish only on the private interface (your Tailscale IP). The default,
    # 127.0.0.1, is reachable from this machine only. Pages ask for no login
    # until you set a password (Settings → Password): anyone who can reach
    # this port sees your finances. On Linux with
    # Tailscale, use docker-compose.tailscale.yml (host networking) instead:
    # Docker's port publishing can hide the real tailnet client address.
    ports:
      - "${DELTA_BIND:-127.0.0.1}:${DELTA_PORT:-3000}:3000"
    volumes:
      - delta-data:/data

  # Plaid refresh + sync every 6h and a daily DB backup (the systemd timers'
  # job on bare metal). Shares delta's network namespace so its requests
  # arrive on loopback.
  jobs:
    image: ghcr.io/zeapsu/delta:${DELTA_TAG:-latest}
    build:
      context: .
      args: { DELTA_COMMIT: "${DELTA_COMMIT:-}" }
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    network_mode: "service:delta"
    depends_on: [delta]
    command: ["node", "scripts/jobs.mjs"]
    volumes:
      - delta-data:/data

volumes:
  delta-data:
