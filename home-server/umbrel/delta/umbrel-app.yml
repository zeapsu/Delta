category: finance
name: Delta
version: "1.1.0"
tagline: Your money, on your machine, readable by your agent
description: >-
  Delta connects your banks, cards and brokerages through Plaid and shows spending, budgets, recurring charges, investments and net worth on a calm dashboard. Your data is stored on your Umbrel.


  First run: open Delta and follow the checklist. It asks for your own Plaid keys (free for personal use), connects your accounts and pulls your history.


  Delta has no chatbot of its own. It serves an MCP server, so the agent you already use can answer questions about your money with the same numbers the dashboard shows. Agents need their own revocable token.


  - Spending by category and month, with pending charges

  - Budgets with month-to-date progress

  - Recurring charges you confirm

  - Investments and net worth history

  - MCP server and REST API with read or write tokens
